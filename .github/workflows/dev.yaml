name: Dev Terraform Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: ${{ vars.TF_VERSION }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}

jobs:

  terraform-plan:
    name: Terraform Init & Plan (DEV)
    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: GitHub Context
        shell: pwsh
        run: |
          Write-Host "Repository : ${{ github.repository }}"
          Write-Host "Branch     : ${{ github.ref }}"
          Write-Host "Event      : ${{ github.event_name }}"
          Write-Host "Actor      : ${{ github.actor }}"

      - name: Verify Secrets
        shell: pwsh
        env:
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          Write-Host "Client Length       : $($env:CLIENT.Length)"
          Write-Host "Tenant Length       : $($env:TENANT.Length)"
          Write-Host "Subscription Length : $($env:SUB.Length)"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        shell: pwsh
        run: |
          az account show
          az account list --output table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Version
        shell: pwsh
        run: terraform version

      - name: Terraform Format
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform Validate
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform validate -no-color

      - name: Terraform Plan
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform plan -input=false -no-color -out=tfplan

  terraform-apply:
    name: Terraform Apply (DEV)

    needs: terraform-plan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        shell: pwsh
        run: |
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform Apply
        shell: pwsh
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform apply -input=false -auto-approve
