name: Build and Push GetTask

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push GetTask Image

    runs-on: self-hosted

    defaults:
      run:
        working-directory: GetTasksTodoMicroservice-main

    env:
      IMAGE_NAME: todo-get-tasks-api
      IMAGE_TAG: ${{ github.run_number }}
      ACR_NAME: sohitacrdev01
      ACR_LOGIN_SERVER: sohitacrdev01.azurecr.io

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: az account show

      - name: Login to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Tag Docker Image
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Push Version Tag
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      - name: Push Latest Tag
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Display Image Information
        run: |
          echo "Successfully pushed:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"